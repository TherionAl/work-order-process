[project]
name = "work_order_process"
version = "1.2.0"
description = "Fetch, normalize, and import Bosssoft work-order data, merge ERP data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pymysql>=1.1.2",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "xlrd>=2.0.2",
    "openpyxl>=3.1.5",
    "apscheduler>=3.10.0",
    "python-dateutil>=2.8.0",
]

[project.scripts]
"work_order_process" = "work_order_process.cli:main"
"erp-merge" = "work_order_process.erp_merge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/work_order_process"]

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
erp = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["work_order_process"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
