name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Check lock file
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Check repository security rules
        run: uv run --all-groups pytest tests/test_repository_security.py -q
      - name: Check formatting
        run: uv run --all-groups ruff format --check src tests
      - name: Lint
        run: uv run --all-groups ruff check src tests
      - name: Run tests with coverage
        run: uv run --all-groups pytest --cov=work_order_process --cov-fail-under=70 -q
      - name: Run tests
        run: uv run --all-groups pytest -q
